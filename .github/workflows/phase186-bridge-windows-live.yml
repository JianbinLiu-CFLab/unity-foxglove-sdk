name: Phase186 Bridge Windows live certification

on:
  workflow_dispatch:

concurrency:
  group: phase186-bridge-windows-live
  cancel-in-progress: false

jobs:
  certify:
    name: Unity plus ROS and RMW live matrix
    runs-on: [self-hosted, Windows, X64, unity2foxglove-phase186-live]
    timeout-minutes: 720
    env:
      UNITY2FOXGLOVE_CI_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      PHASE186_ROS2_HUMBLE_ROOT: ${{ vars.PHASE186_ROS2_HUMBLE_ROOT || 'C:\ros2_humble\ros2-windows' }}
      PHASE186_ROS2_JAZZY_ROOT: ${{ vars.PHASE186_ROS2_JAZZY_ROOT || 'C:\ros2_jazzy\ros2-windows' }}
      PHASE186_ROS2_LYRICAL_ROOT: ${{ vars.PHASE186_ROS2_LYRICAL_ROOT || 'C:\ros2_lyrical\ros2-windows' }}
    steps:
      - name: Require Node 24-capable Actions runner
        shell: powershell
        run: |
          $requiredVersion = [version]'2.327.1'
          $listenerPath = Join-Path $env:SystemDrive 'actions-runner\bin\Runner.Listener.exe'
          if (-not (Test-Path -LiteralPath $listenerPath)) {
            throw "Actions Runner $requiredVersion or newer is required at $listenerPath."
          }
          $versionOutput = & $listenerPath --version 2>&1
          $runnerExitCode = $LASTEXITCODE
          $versionText = ($versionOutput | Select-Object -First 1).ToString().Trim()
          if ($runnerExitCode -ne 0 -or $versionText -notmatch '^\d+\.\d+\.\d+$') {
            throw "Unable to read the Actions Runner version from $listenerPath."
          }
          $actualVersion = [version]$versionText
          if ($actualVersion -lt $requiredVersion) {
            throw "Actions Runner $actualVersion is too old for Node 24 actions. Upgrade to $requiredVersion or newer."
          }
          Write-Host "Actions Runner $actualVersion supports Node 24 actions."

      - name: Bootstrap PowerShell 7 on PATH
        shell: cmd
        run: |
          set "POWERSHELL7=C:\Program Files\PowerShell\7"
          if not exist "%POWERSHELL7%\pwsh.exe" (
            echo PowerShell 7 MSI installation is required.
            exit /b 1
          )
          echo %POWERSHELL7%>>"%GITHUB_PATH%"
          set "PATH=%POWERSHELL7%;%PATH%"
          where pwsh
          pwsh -NoLogo -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: Enable Git long-path support
        shell: pwsh
        run: |
          $globalConfig = Join-Path $env:RUNNER_TEMP ("git-global-{0}.config" -f $env:GITHUB_RUN_ID)
          "GIT_CONFIG_GLOBAL=$globalConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:GIT_CONFIG_GLOBAL = $globalConfig
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Clean runner workspace while preserving Unity Library
        shell: pwsh
        run: git clean -ffdx -e Unity2Foxglove/Library/

      - name: Checkout pinned official Foxglove schema reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: foxglove/foxglove-sdk
          ref: b298c3d1649e6e5dfd77a53b12ab7c27f97c7aba
          path: third-party/foxglove-sdk
          persist-credentials: false

      - name: Run exact-head Phase186 Windows live certification
        shell: pwsh
        run: python Scripts/release/run_ci.py --only phase186-bridge-windows-live

      - name: Upload terminal, actor, graph, QoS, process, and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase186-bridge-windows-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase186/windows-live
            build/phase186/bridge/*/build-summary.json
            build/phase186/bridge/*/overlay-authority.json
            build/phase186/bridge/*/*.log
            build/phase186/bridge/*/peer-workspace/colcon-build.log
          if-no-files-found: error
