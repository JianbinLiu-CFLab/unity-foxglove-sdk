name: dotnet tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "Plan/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "Plan/**"
      - "**.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned official MCAP harness
        run: corepack enable

      - name: Restore Roslyn analyzer project
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Editor/SourceGenerators/FoxgloveLogSourceGenerator.csproj --ignore-failed-sources

      - name: Build Roslyn analyzer DLL for freshness check
        run: dotnet build Packages/dev.unity2foxglove.sdk/Editor/SourceGenerators/FoxgloveLogSourceGenerator.csproj -c Release -o build/SourceGenerators/Release/netstandard2.0 --no-restore

      - name: Validate source generator DLL freshness script
        run: python3 Scripts/package/validate_source_generator_dll.py

      - name: Restore runtime test project
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj --ignore-failed-sources

      - name: Run validation suite
        run: dotnet run --no-restore --project Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj

      - name: Run official MCAP differential conformance
        run: python3 Scripts/mcap/conformance/run_phase121_conformance.py --release-blocking --report-path build/mcap-conformance/phase121-conformance-report.json

      - name: Restore xUnit unit test project
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj --ignore-failed-sources

      - name: Run xUnit unit tests
        run: dotnet test --no-restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj --logger "trx;LogFileName=unit-tests.trx" --results-directory build/TestResults/Unit

      - name: Validate local entrypoints
        run: python3 Scripts/package/validate_local_entrypoints.py

      - name: Upload xUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: build/TestResults/Unit
          if-no-files-found: ignore

      - name: Upload MCAP differential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcap-differential-report
          path: build/mcap-conformance/phase121-conformance-report.json
          if-no-files-found: warn

  analyzer-freshness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Restore Roslyn analyzer project
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Editor/SourceGenerators/FoxgloveLogSourceGenerator.csproj --ignore-failed-sources

      - name: Build Roslyn analyzer DLL for freshness check
        run: dotnet build Packages/dev.unity2foxglove.sdk/Editor/SourceGenerators/FoxgloveLogSourceGenerator.csproj -c Release -o build/SourceGenerators/Release/netstandard2.0 --no-restore

      - name: Validate source generator DLL freshness script
        run: python Scripts/package/validate_source_generator_dll.py

      - name: Restore runtime test project
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj --ignore-failed-sources

      - name: Verify checked-in analyzer DLL freshness
        run: dotnet run --no-restore --project Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj -- --phase115f
