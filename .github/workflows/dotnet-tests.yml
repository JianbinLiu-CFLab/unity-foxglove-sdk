  windows-ros2-native:
    name: "Windows: ROS2 Native xUnit with Jazzy runtime"
    # Pull request code reaches the persistent runner only when the repository owner triggered the event.
    if: >-
      vars.UNITY_SELF_HOSTED_RUNNER == 'enabled'
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor == github.repository_owner))
    runs-on: [self-hosted, Windows, X64, unity2foxglove-phase186-live]
    timeout-minutes: 30
    env:
      PHASE186_ROS2_JAZZY_ROOT: ${{ vars.PHASE186_ROS2_JAZZY_ROOT || 'C:\ros2_jazzy\ros2-windows' }}
    steps:
      - &require_node24_runner
        name: Require Node 24-capable Actions runner
        shell: powershell
        run: |
          $requiredVersion = [version]'2.327.1'
          $listenerPath = Join-Path $env:SystemDrive 'actions-runner\bin\Runner.Listener.exe'
          if (-not (Test-Path -LiteralPath $listenerPath)) {
            throw "Actions Runner $requiredVersion or newer is required at $listenerPath."
          }
          $versionOutput = & $listenerPath --version 2>&1
          $runnerExitCode = $LASTEXITCODE
          $versionText = ($versionOutput | Select-Object -First 1).ToString().Trim()
          if ($runnerExitCode -ne 0 -or $versionText -notmatch '^\d+\.\d+\.\d+$') {
            throw "Unable to read the Actions Runner version from $listenerPath."
          }
          $actualVersion = [version]$versionText
          if ($actualVersion -lt $requiredVersion) {
            throw "Actions Runner $actualVersion is too old for Node 24 actions. Upgrade to $requiredVersion or newer."
          }
          Write-Host "Actions Runner $actualVersion supports Node 24 actions."

      - name: Bootstrap PowerShell 7 on PATH
        shell: cmd
        run: |
          set "POWERSHELL7=C:\Program Files\PowerShell\7"
          if not exist "%POWERSHELL7%\pwsh.exe" (
            echo PowerShell 7 MSI installation is required.
            exit /b 1
          )
          echo %POWERSHELL7%>>"%GITHUB_PATH%"
          set "PATH=%POWERSHELL7%;%PATH%"
          where pwsh
          pwsh -NoLogo -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: Configure Git long paths for Windows ROS2 Native
        shell: pwsh
        run: |
          $globalConfig = Join-Path $env:RUNNER_TEMP ("git-global-{0}.config" -f $env:GITHUB_RUN_ID)
          "GIT_CONFIG_GLOBAL=$globalConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:GIT_CONFIG_GLOBAL = $globalConfig
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Clean runner workspace while preserving Unity Library
        shell: pwsh
        run: git clean -ffdx -e 'Unity2Foxglove/Library/' -e 'Unity2Foxglove/Library-*/'

      - name: Configure build temporary directories
        shell: pwsh
        run: |
          $tempRoot = Join-Path $env:GITHUB_WORKSPACE 'build/tmp'
          New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          "TEMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Require preinstalled .NET 10 SDK
        shell: pwsh
        run: |
          $sdks = dotnet --list-sdks
          $sdks
          if (-not ($sdks | Where-Object { $_ -match '^10\.' })) {
            throw '.NET 10 SDK is required on the self-hosted runner.'
          }

      - name: Put Jazzy and R2FU native libraries on PATH
        shell: pwsh
        run: |
          $rosRoot = $env:PHASE186_ROS2_JAZZY_ROOT
          $plugins = Join-Path $env:GITHUB_WORKSPACE 'Packages/dev.unity2foxglove.ros2forunity.runtime.jazzy.win64/Runtime/Ros2ForUnity/Plugins/Windows/x86_64'
          foreach ($required in @(
              (Join-Path $rosRoot 'bin/sensor_msgs__rosidl_typesupport_c.dll'),
              (Join-Path $plugins 'sensor_msgs_imu__rosidl_typesupport_c_native.dll'))) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required ROS2 native library is missing: $required"
            }
          }
          $plugins | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $rosRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $rosRoot 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Restore Windows ROS2 Native xUnit lane
        shell: pwsh
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj -p:IncludeRos2ForUnityNative=true

      - name: Run Windows ROS2 Native xUnit gate
        shell: pwsh
        run: dotnet test --no-restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj -p:IncludeRos2ForUnityNative=true --logger "trx;LogFileName=unit-tests-windows-native.trx" --results-directory build/TestResults/WindowsRos2Native

      - name: Upload Windows ROS2 Native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ros2-native-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/TestResults/WindowsRos2Native
          if-no-files-found: error

