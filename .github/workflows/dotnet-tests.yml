name: dotnet tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-xunit:
    name: "Linux: SDK and Bridge xUnit, performance regression"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with provenance history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned Python test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input psutil==7.0.0 websockets==15.0.1 mcap==1.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0"

      - name: Restore xUnit unit test project
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj

      - name: Run xUnit unit tests
        if: always()
        run: dotnet test --no-restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj --logger "trx;LogFileName=unit-tests.trx" --results-directory build/TestResults/Unit

      - name: Restore ROS2 Bridge behavioral xUnit tests
        if: always()
        run: dotnet restore Packages/dev.unity2foxglove.ros2bridge/Tests/Unit/Unity2Foxglove.Ros2Bridge.UnitTests.csproj

      - name: Run ROS2 Bridge behavioral xUnit tests
        if: always()
        run: dotnet test --no-restore Packages/dev.unity2foxglove.ros2bridge/Tests/Unit/Unity2Foxglove.Ros2Bridge.UnitTests.csproj --logger "trx;LogFileName=unit-tests-ros2bridge.trx" --results-directory build/TestResults/Ros2Bridge

      - name: Remove generated ROS2 Bridge test intermediates
        if: always()
        run: rm -rf Packages/dev.unity2foxglove.ros2bridge/Tests/Unit/bin Packages/dev.unity2foxglove.ros2bridge/Tests/Unit/obj

      - name: Restore deterministic performance regression tests
        if: always()
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Performance/Regression/FoxgloveSdk.PerformanceRegressionTests.csproj

      - name: Run deterministic performance regression tests
        if: always()
        run: dotnet test --no-restore Packages/dev.unity2foxglove.sdk/Tests/Performance/Regression/FoxgloveSdk.PerformanceRegressionTests.csproj --logger "trx;LogFileName=performance-regression.trx" --results-directory build/TestResults/PerformanceRegression

      - name: Run performance harness regression tests
        if: always()
        run: python3 -m unittest Scripts.performance.regression_checks.test_performance_tooling Scripts.performance.regression_checks.test_phase188_replay

      - name: Upload xUnit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: build/TestResults/Unit
          if-no-files-found: error

  linux-runtime:
    name: "Linux: Manager boundary xUnit and runtime validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with provenance history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned official Foxglove schema reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: foxglove/foxglove-sdk
          ref: b298c3d1649e6e5dfd77a53b12ab7c27f97c7aba
          path: third-party/foxglove-sdk
          persist-credentials: false

      - name: Checkout pinned official ROS-TCP-Connector reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Unity-Technologies/ROS-TCP-Connector
          ref: c27f00c6cf750d2d0564349b3039d19aa3925e7c
          path: third-party/ROS-TCP-Connector
          persist-credentials: false

      - name: Normalize ROS-TCP-Connector reference origin
        run: git -C third-party/ROS-TCP-Connector remote set-url origin https://github.com/Unity-Technologies/ROS-TCP-Connector.git

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned Python test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input psutil==7.0.0 websockets==15.0.1 mcap==1.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0"

      - name: Restore Manager production-boundary xUnit lane
        if: always()
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj -p:IncludeManagerProductionBoundary=true

      - name: Run Manager production-boundary xUnit lane
        if: always()
        run: dotnet test --no-restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj -p:IncludeManagerProductionBoundary=true --logger "trx;LogFileName=unit-tests-manager-boundary.trx" --results-directory build/TestResults/ManagerProductionBoundary

      - name: Restore Roslyn analyzer project
        if: always()
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Editor/SourceGenerators/FoxgloveLogSourceGenerator.csproj

      - name: Validate source generator DLL freshness script
        if: always()
        run: python3 Scripts/package/validate_source_generator_dll.py

      - name: Restore runtime test project
        if: always()
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj

      - name: Run default runtime validation suite
        if: always()
        run: dotnet run --no-restore --project Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj

      - name: Run CI-safe known-failure ratchet
        if: always()
        run: dotnet run --no-restore --project Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj -- --ci-safe-ratchet

      - name: Reject CI-safe known-failure baseline additions
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 Scripts/validation/ci_safe_baseline.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA"

      - name: Run Phase163-25 Inspector lifecycle validation
        if: always()
        run: dotnet run --no-restore --project Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj -- --phase163-25

      - name: Run Workstream F explicit runtime closure validations
        if: always()
        run: |
          set -uo pipefail
          status=0
          for flag in --phase121 --phase128 --phase129 --phase130 --phase131 --phase132 --phase138l --phase138m --phase138p --phase139d --phase163-54 --phase164-38 --phase164-41 --phase164-42 --phase175c; do
            dotnet run --no-restore --project Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj -- "$flag" || status=$?
          done
          exit "$status"

      - name: Upload Manager production-boundary test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manager-production-boundary-test-results
          path: build/TestResults/ManagerProductionBoundary
          if-no-files-found: error

  linux-python-regressions:
    name: "Linux: Python regressions and package closure"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with provenance history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned official Foxglove schema reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: foxglove/foxglove-sdk
          ref: b298c3d1649e6e5dfd77a53b12ab7c27f97c7aba
          path: third-party/foxglove-sdk
          persist-credentials: false

      - name: Checkout pinned official ROS-TCP-Connector reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Unity-Technologies/ROS-TCP-Connector
          ref: c27f00c6cf750d2d0564349b3039d19aa3925e7c
          path: third-party/ROS-TCP-Connector
          persist-credentials: false

      - name: Normalize ROS-TCP-Connector reference origin
        run: git -C third-party/ROS-TCP-Connector remote set-url origin https://github.com/Unity-Technologies/ROS-TCP-Connector.git

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run structural source guards
        env:
          STRUCTURE_GUARD_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B -m Scripts.architecture.structure_guards --base-ref "$STRUCTURE_GUARD_BASE_REF"

      - name: Install pinned Python test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input psutil==7.0.0 websockets==15.0.1 mcap==1.3.1

      - name: Verify remote gateway manifest against pinned source
        run: python3 -c "from Scripts.remotegateway.regression_checks.test_remote_gateway_tooling import verify_pinned_source_manifest; verify_pinned_source_manifest()"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0"

      - name: Run Phase179 ROS2 acceptance helper regressions
        if: always()
        run: |
          python3 -m unittest Scripts.smoke.ros2.regression_checks.test_phase179_foxrun_ros2_inbound_acceptance
          python3 -m unittest Scripts.smoke.ros2.regression_checks.test_phase179_foxrun_ros2_player_host
          python3 -m unittest Scripts.smoke.ros2.regression_checks.test_phase179_foxrun_ros2_matrix_profiles
          python3 -m unittest Scripts.smoke.ros2.regression_checks.test_phase179_zenoh_topology

      - name: Run Phase181 custom ROS2 acceptance helper regressions
        if: always()
        run: |
          python3 -m unittest Scripts.smoke.ros2.regression_checks.test_phase181_custom_ros2_peer_protocol
          python3 -m unittest Scripts.smoke.ros2.regression_checks.test_phase181_custom_ros2_peer
          python3 -m unittest Scripts.smoke.ros2.regression_checks.test_phase181_custom_ros2_matrix_profiles
          python3 -m unittest Scripts.smoke.ros2.regression_checks.test_phase181_custom_ros2_linux_peer
          python3 -m unittest Scripts.ros2forunity.interfaces.regression_checks.test_interface_digest
          python3 -m unittest Scripts.ros2forunity.interfaces.regression_checks.test_characterize_foxrun_custom_interface
          python3 -m unittest Scripts.ros2forunity.interfaces.regression_checks.test_build_foxrun_custom_typesupport_addon
          python3 -m unittest Scripts.ros2forunity.interfaces.regression_checks.test_refresh_phase181_custom_typesupport_addons
          python3 -m unittest Scripts.ros2forunity.interfaces.regression_checks.test_sync_foxrun_custom_typesupport_addon
          python3 -m unittest Scripts.ros2forunity.interfaces.regression_checks.test_validate_foxrun_custom_typesupport_addon
          python3 -m unittest Scripts.ros2forunity.interfaces.regression_checks.test_verify_foxrun_custom_typesupport_toolchain
          python3 -m unittest Scripts.ros2forunity.interfaces.regression_checks.test_h07_health_deadline_contract
          python3 -m unittest Scripts.ros2forunity.interfaces.regression_checks.test_h02_subst_cleanup_contract

      - name: Run complete Phase181 interface regression lane
        if: always()
        run: python3 -B Scripts/release/regression_inventory.py --run-lane phase181-interface-tooling

      - name: Run complete portable regression lane
        if: always()
        run: python3 -B Scripts/release/regression_inventory.py --run-lane portable-regression-tooling

      - name: Check Python regression inventory coverage
        if: always()
        env:
          SOURCE_DECOMPOSITION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B Scripts/release/regression_inventory.py

      - name: Run Phase186 Bridge tooling and package-composition gate
        if: always()
        run: python3 Scripts/release/run_ci.py --only phase186-bridge-tooling

      - name: Run package and sample closure lane
        if: always()
        env:
          SOURCE_DECOMPOSITION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_DECOMPOSITION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B Scripts/release/run_ci.py --only packages

      - name: Run live source-text inventory
        if: always()
        timeout-minutes: 20
        env:
          SOURCE_TEXT_INVENTORY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/source-text-inventory-trusted-base"
          rm -rf "$trusted_root"
          mkdir -p "$trusted_root"
          trusted_tree="$RUNNER_TEMP/source-text-inventory-trusted-tree"
          rm -rf "$trusted_tree"
          mkdir -p "$trusted_tree"
          trusted_revision="$SOURCE_TEXT_INVENTORY_BASE_SHA"
          trusted_minimum_revision="fe195f288a3df0c9754056ef2d84c095c2e98cf7"
          if ! git merge-base --is-ancestor "$trusted_minimum_revision" "$trusted_revision"; then
            echo "Trusted source-text inventory base predates the --base-ref checker minimum" >&2
            exit 1
          fi
          if ! git cat-file -e "$trusted_revision:Scripts/validation/source_text_inventory.py" 2>/dev/null; then
            echo "Trusted source-text inventory checker is missing from the PR base" >&2
            exit 1
          fi
          git archive "$trusted_revision" -- ':(glob)Scripts/validation/source_text_inventory*.py' | tar -x -C "$trusted_root"
          git archive "$trusted_revision" -- \
            ':(glob)Packages/*/Runtime/**/*.cs' \
            ':(glob)Packages/*/Editor/**/*.cs' \
            ':(glob)Packages/*/Tests/Runtime/**/*.cs' \
            ':(glob)Packages/*/Tests/Unit/**/*.cs' \
            ':(glob)Scripts/validation/**/*.py' | tar -x -C "$trusted_tree"
          trusted_checker="$trusted_root/Scripts/validation/source_text_inventory.py"
          if ! python3 -I "$trusted_checker" --help 2>&1 | grep -q -- "--base-ref"; then
            echo "Trusted source-text inventory checker lacks --base-ref" >&2
            exit 1
          fi
          reviewed_checker_root=$(mktemp -d "$RUNNER_TEMP/source-text-inventory-reviewed-head.XXXXXX")
          actual_migration_checker_sha=$(python3 -I -B - "$reviewed_checker_root" <<'MIGRATION_CHECKER'
          import hashlib
          import sys
          from pathlib import Path

          root = Path.cwd()
          destination = Path(sys.argv[1])
          destination.mkdir(parents=True, exist_ok=True)
          digest = hashlib.sha256()
          for path in sorted(root.glob("Scripts/validation/source_text_inventory*.py")):
              data = path.read_bytes()
              digest.update(path.relative_to(root).as_posix().encode("utf-8"))
              digest.update(b"\0")
              digest.update(data.replace(b"\r\n", b"\n"))
              (destination / path.name).write_bytes(data)
          print(digest.hexdigest())
          MIGRATION_CHECKER
          )
          trusted_checker_sha=$(python3 -I -B - "$trusted_root" <<'TRUSTED_CHECKER'
          import hashlib
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          digest = hashlib.sha256()
          for path in sorted(root.glob("Scripts/validation/source_text_inventory*.py")):
              data = path.read_bytes()
              digest.update(path.relative_to(root).as_posix().encode("utf-8"))
              digest.update(b"\0")
              digest.update(data.replace(b"\r\n", b"\n"))
          print(digest.hexdigest())
          TRUSTED_CHECKER
          )
          if [ "$trusted_revision" != "$trusted_minimum_revision" ] \
            && [ "$trusted_revision" != "69d645a31940054eccd776c17b175378f11d6dca" ] \
            && [ "$trusted_revision" != "202be484368654e24e353059d052487b6fa31f3a" ]; then
            if [ "$actual_migration_checker_sha" != "$trusted_checker_sha" ]; then
              echo "Current checker differs from immutable base checker without a reviewed migration approval" >&2
              exit 1
            fi
          fi
          migration_args=()
          if [ "$trusted_revision" = "$trusted_minimum_revision" ]; then
            migration_approval_file="$RUNNER_TEMP/source-text-parser-migration-approval.json"
            cat > "$migration_approval_file" <<'MIGRATION_APPROVAL'
          {
            "base_revision": "fe195f288a3df0c9754056ef2d84c095c2e98cf7",
            "checker_sha256": "d7a5056a52eb3c378d8404fe23e9ad1cf788c438d62e35f3abc528513c76213e",
            "base_inventory_sha256": "ae5e9f418ef6d23fb65485a2ba756ba7aeeb27632cd040735d0ed111540856cc",
            "current_inventory_sha256": "85209891da4e0dfdcc1cce12661dad018cbac0a4a0014bd7bcda18ccd82e50df",
            "reason": "User approved this exact legacy-to-v2 parser migration through the reviewed workflow on 2026-11-10."
          }
          MIGRATION_APPROVAL
            expected_migration_checker_sha=$(python3 -I -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["checker_sha256"])' "$migration_approval_file")
            if [ "$actual_migration_checker_sha" != "$expected_migration_checker_sha" ]; then
              echo "Reviewed parser migration checker SHA-256 does not match" >&2
              exit 1
            fi
            migration_args=(--parser-migration-approval "$migration_approval_file")
          elif [ "$trusted_revision" = "69d645a31940054eccd776c17b175378f11d6dca" ]; then
            migration_approval_file="$RUNNER_TEMP/source-text-parser-maintenance-approval.json"
            cat > "$migration_approval_file" <<'MIGRATION_APPROVAL'
          {
            "base_revision": "69d645a31940054eccd776c17b175378f11d6dca",
            "checker_sha256": "38c38ab571a46ec8b4fda77c4c5d15ee8d815675a3cf1dbf17d9d465672adb66",
            "base_inventory_sha256": "97420087aa3bd1bfd8ff3aa74b7d6fe3de21a1057ec259519babc48ca55ee9f0",
            "current_inventory_sha256": "5635d87016b5d964abc02594a777c7a0a2ff4eb205555f8683081721f3f2dad7",
            "parser_changes_sha256": "ede78e7466075185021dd214ee6a0272c28334b57edcbe425af193c2a6ec650a",
            "scope": "versioned-parser-maintenance",
            "reason": "Reviewed exact parser maintenance required to isolate unrelated performance sources from validation helper resolution."
          }
          MIGRATION_APPROVAL
            expected_migration_checker_sha=$(python3 -I -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["checker_sha256"])' "$migration_approval_file")
            if [ "$actual_migration_checker_sha" != "$expected_migration_checker_sha" ]; then
              echo "Reviewed parser maintenance checker SHA-256 does not match" >&2
              exit 1
            fi
            migration_args=(--parser-migration-approval "$migration_approval_file")
          elif [ "$trusted_revision" = "202be484368654e24e353059d052487b6fa31f3a" ]; then
            migration_approval_file="$RUNNER_TEMP/source-text-parser-maintenance-approval.json"
            cat > "$migration_approval_file" <<'MIGRATION_APPROVAL'
          {
            "base_revision": "202be484368654e24e353059d052487b6fa31f3a",
            "checker_sha256": "0f1415da9802c0ae654b7de6b4d3ae32875608db7814ae79093e88071119dc09",
            "base_inventory_sha256": "97420087aa3bd1bfd8ff3aa74b7d6fe3de21a1057ec259519babc48ca55ee9f0",
            "current_inventory_sha256": "942b9c17295cd06bf30710802c6f35467c16df6a91fee5ad6a984f5b6be16290",
            "parser_changes_sha256": "c647094ec1573de6d2134a8aedf5a0ba0f8e1c499981aea780de7e384f7f8e9b",
            "scope": "versioned-parser-maintenance",
            "reason": "Reviewed exact parser maintenance to keep unresolved production helper candidates out of validation harness signatures in the Phase200 follow-up."
          }
          MIGRATION_APPROVAL
            expected_migration_checker_sha=$(python3 -I -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["checker_sha256"])' "$migration_approval_file")
            if [ "$actual_migration_checker_sha" != "$expected_migration_checker_sha" ]; then
              echo "Reviewed parser maintenance checker SHA-256 does not match" >&2
              exit 1
            fi
            migration_args=(--parser-migration-approval "$migration_approval_file")
          fi
          python3 -I -B "$trusted_checker" --root "$trusted_tree" --output build/review/source-text-inventory-trusted
          python3 -I -B "$reviewed_checker_root/source_text_inventory.py" --root . --base-ref "$SOURCE_TEXT_INVENTORY_BASE_SHA" --trusted-base-inventory build/review/source-text-inventory-trusted --output build/review/source-text-inventory "${migration_args[@]}"

      - name: Upload live source-text inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-text-inventory-${{ github.run_id }}
          path: |
            build/review/source-text-inventory/
            build/review/source-text-inventory-trusted/
          if-no-files-found: error

  linux-identity-gate:
    name: "Linux: source-decomposition identity gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with provenance history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run source-decomposition base-head identity equivalence gate
        if: always()
        env:
          SOURCE_DECOMPOSITION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_DECOMPOSITION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/source-decomposition-trusted-base"
          mkdir -p "$trusted_root"
          trusted_revision="$SOURCE_DECOMPOSITION_BASE_SHA"
          if [ "$SOURCE_DECOMPOSITION_BASE_SHA" = "9b3754bd21631e4c1a8717f9a133c1063ab56d33" ]; then
            # Bootstrap the merged #542 checker regression from its reviewed predecessor once.
            trusted_revision="ab1487e654ce11b5e217329552751a058a250ef7"
            echo "IDENTITY_GATE_BOOTSTRAP_REQUIRED: using reviewed pre-#542 checker"
          fi
          if ! git merge-base --is-ancestor "$trusted_revision" "$SOURCE_DECOMPOSITION_BASE_SHA"; then
            echo "Trusted identity checker revision is not an ancestor of the PR base" >&2
            exit 1
          fi
          archive_paths=(Scripts/smoke/foxrun Scripts/smoke/ros2 Scripts/smoke/websocket)
          checker_relative=""
          # The selected checker is invoked later with --compatibility; git archive copies its trusted tree.
          if git cat-file -e "$trusted_revision:Scripts/validation/source_decomposition/compare_identity_surfaces.py" 2>/dev/null; then
            archive_paths+=(Scripts/validation/source_decomposition)
            checker_relative="Scripts/validation/source_decomposition/compare_identity_surfaces.py"
          elif git cat-file -e "$trusted_revision:Scripts/phase192/compare_identity_surfaces.py" 2>/dev/null; then
            archive_paths+=(Scripts/phase192)
            checker_relative="Scripts/phase192/compare_identity_surfaces.py"
            echo "IDENTITY_GATE_BOOTSTRAP_REQUIRED: using legacy source-decomposition checker path"
          else
            echo "Trusted source-decomposition checker is missing" >&2
            exit 1
          fi
          # The selected trusted checker must support --compatibility in either layout.
          git archive "$trusted_revision" -- "${archive_paths[@]}" | tar -x -C "$trusted_root"
          export PYTHONPATH="$trusted_root"
          # Both identity invocations compare the checked-out repository: --repository .
          # The trusted checker path is selected only from the immutable base revision.
          base_checker="$trusted_root/$checker_relative"
          if [ ! -f "$base_checker" ]; then
            echo "Trusted base identity checker is missing" >&2
            exit 1
          fi
          if ! python3 "$base_checker" --help 2>&1 | grep -q -- "--compatibility"; then
            echo "IDENTITY_GATE_BOOTSTRAP_REQUIRED: trusted base checker lacks --compatibility" >&2
            exit 1
          fi
          trusted_compare_base="$SOURCE_DECOMPOSITION_BASE_SHA"
          trusted_compare_head="$SOURCE_DECOMPOSITION_HEAD_SHA"
          trusted_compare_repository="."
          if [ "$checker_relative" = "Scripts/phase192/compare_identity_surfaces.py" ]; then
            # The historical checker archives Scripts/phase192. Normalize only the
            # semantic head in a temporary Git repository before invoking it.
            compat_root="$RUNNER_TEMP/source-decomposition-legacy-compat"
            mkdir -p "$compat_root"
            git init -q "$compat_root"
            git -C "$compat_root" config user.name "source-decomposition-identity-gate"
            git -C "$compat_root" config user.email "source-decomposition-identity-gate@example.invalid"
            git archive "$SOURCE_DECOMPOSITION_BASE_SHA" | tar -x -C "$compat_root"
            git -C "$compat_root" add -A
            git -C "$compat_root" commit -q -m "trusted base compatibility snapshot"
            trusted_compare_base="$(git -C "$compat_root" rev-parse HEAD)"
            git -C "$compat_root" rm -r -q --ignore-unmatch .
            git -C "$compat_root" clean -fdx
            git archive "$SOURCE_DECOMPOSITION_HEAD_SHA" | tar -x -C "$compat_root"
            if [ -d "$compat_root/Scripts/validation/source_decomposition" ]; then
              if [ -e "$compat_root/Scripts/phase192" ]; then
                rm -rf "$compat_root/Scripts/phase192"
              fi
              mv "$compat_root/Scripts/validation/source_decomposition" "$compat_root/Scripts/phase192"
            fi
            git -C "$compat_root" add -A
            git -C "$compat_root" commit -q -m "semantic head compatibility snapshot"
            trusted_compare_head="$(git -C "$compat_root" rev-parse HEAD)"
            trusted_compare_repository="$compat_root"
            echo "IDENTITY_GATE_BOOTSTRAP_REQUIRED: normalized semantic head for legacy checker"
          fi
          trusted_log="$RUNNER_TEMP/source-decomposition-trusted-base.log"
          set +e
          PYTHONPATH="$trusted_root" python3 "$base_checker" \
            --base "$trusted_compare_base" \
            --head "$trusted_compare_head" \
            --repository "$trusted_compare_repository" \
            --compatibility >"$trusted_log" 2>&1
          trusted_status=$?
          set -e
          if [ "$trusted_status" -ne 0 ]; then
            cat "$trusted_log"
            exit "$trusted_status"
          fi
          cat "$trusted_log"

          # Run the checked-in head checker as a second gate so newly supported
          # manifest-backed Python facades cannot remain outside the trusted
          # base checker's older identity surface.
          python3 Scripts/validation/source_decomposition/compare_identity_surfaces.py \
            --base "$SOURCE_DECOMPOSITION_BASE_SHA" \
            --head "$SOURCE_DECOMPOSITION_HEAD_SHA" \
            --repository . \
            --compatibility

  linux-conformance-panels:
    name: "Linux: MCAP conformance and Foxglove panels"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with provenance history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned Python test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input psutil==7.0.0 websockets==15.0.1 mcap==1.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: always()
        with:
          node-version: "22"

      - name: Run FoxRun publish panel behavior tests
        if: always()
        working-directory: Tools/foxglove-extensions/foxrun-publish-panel
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Run Unity cursor bridge tests
        if: always()
        working-directory: Tools/foxglove-extensions/unity-cursor-bridge
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Enable Corepack for the pinned official MCAP harness
        if: always()
        run: corepack enable

      - name: Run official MCAP differential conformance
        if: always()
        run: python3 Scripts/mcap/conformance/run_phase121_conformance.py --release-blocking --report-path build/mcap-conformance/${{ github.run_id }}-${{ github.run_attempt }}/phase121-conformance-report.json

      - name: Upload MCAP differential report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcap-differential-report
          path: build/mcap-conformance/${{ github.run_id }}-${{ github.run_attempt }}/phase121-conformance-report.json
          if-no-files-found: warn

  optional-ros2-adapter:
    name: "Linux: optional ROS2 adapter xUnit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0"

      - name: Restore optional ROS2 adapter xUnit lane
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj -p:IncludeRos2ForUnityAdapter=true

      - name: Run optional ROS2 adapter xUnit gate
        run: dotnet test --no-restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj -p:IncludeRos2ForUnityAdapter=true --logger "trx;LogFileName=unit-tests-adapter.trx" --results-directory build/TestResults/OptionalRos2Adapter

      - name: Upload optional ROS2 adapter test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optional-ros2-adapter-test-results
          path: build/TestResults/OptionalRos2Adapter
          if-no-files-found: error

  optional-ros2-native:
    # This lane validates managed compile-surface contracts only. Win64 native
    # loading and ROS/RMW runtime certification remain in phase186 live workflow.
    name: "Linux: optional ROS2 Native compile surface"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0"

      - name: Restore optional ROS2 Native compile-surface xUnit lane
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj -p:IncludeRos2ForUnityNative=true

      - name: Run optional ROS2 Native compile-surface xUnit gate
        run: dotnet test --no-restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj -p:IncludeRos2ForUnityNative=true --logger "trx;LogFileName=unit-tests-native.trx" --results-directory build/TestResults/OptionalRos2Native

      - name: Upload optional ROS2 Native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optional-ros2-native-test-results
          path: build/TestResults/OptionalRos2Native
          if-no-files-found: error

  optional-ros2-runtime-validation:
    name: "Linux: optional ROS2 runtime validations"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0"

      - name: Build optional ROS2 adapter runtime validation project
        run: dotnet build Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj -p:IncludeRos2ForUnityAdapter=true

      - name: Run Phase179 R2FU subscription Provider boundary validation
        run: dotnet run --no-build --project Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj -p:IncludeRos2ForUnityAdapter=true -- --phase179

      - name: Run Phase181 custom R2FU interface interop release gate validation
        run: dotnet run --no-build --project Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj -p:IncludeRos2ForUnityAdapter=true -- --phase181

  u2r2-native:
    name: "Linux: U2R2 C++ native gtest"
    runs-on: ubuntu-latest
    container:
      image: ros@sha256:066420e07f60aa18262f2479981def87ebcfcec42eefb0c0c57c4a46098348ca
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install ROS2 build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            nlohmann-json3-dev \
            python3-colcon-common-extensions \
            python3-rosdep
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install \
            --from-paths Tools/ros2_bridge \
            --ignore-src \
            --rosdistro jazzy \
            -r -y

      - name: Build U2R2 C++ test target
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          colcon build \
            --base-paths Tools/ros2_bridge \
            --packages-select unity2foxglove_ros2_bridge \
            --build-base build/u2r2-native/build \
            --install-base build/u2r2-native/install \
            --cmake-args -DBUILD_TESTING=ON

      - name: Run U2R2 protocol gtest target
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          colcon test \
            --base-paths Tools/ros2_bridge \
            --packages-select unity2foxglove_ros2_bridge \
            --build-base build/u2r2-native/build \
            --install-base build/u2r2-native/install \
            --ctest-args -R '^test_u2r2_protocol$' --output-on-failure
          colcon test-result --test-result-base build/u2r2-native/build

  windows-parity:
    name: "Windows: runtime, xUnit, panel, and package parity"
    runs-on: windows-latest
    steps:
      - name: Configure Git long paths for Windows parity
        shell: pwsh
        run: |
          $globalConfig = Join-Path $env:RUNNER_TEMP ("git-global-{0}.config" -f $env:GITHUB_RUN_ID)
          "GIT_CONFIG_GLOBAL=$globalConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:GIT_CONFIG_GLOBAL = $globalConfig
          git config --global core.longpaths true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Tools/foxglove-extensions/foxrun-publish-panel/package-lock.json

      - name: Run Windows runtime validation
        shell: pwsh
        run: python -B Scripts/release/run_ci.py --only dotnet-runtime

      - name: Run Media Foundation native smoke
        if: always()
        shell: pwsh
        run: python -B Scripts/release/run_ci.py --only mediafoundation-native-smoke

      - name: Run Windows core xUnit tests
        shell: pwsh
        run: python -B Scripts/release/run_ci.py --only xunit

      - name: Run Windows FoxRun panel tests
        shell: pwsh
        run: python -B Scripts/release/run_ci.py --only foxrun-publish-panel

      - name: Run Windows Phase184 acceptance tooling
        shell: pwsh
        run: python -B Scripts/release/run_ci.py --only phase184-acceptance-tooling

      - name: Run Windows package validation
        shell: pwsh
        run: python -B Scripts/package/validate_unity_package.py

      - name: Run Windows portable regression inventory lane
        shell: pwsh
        run: python -B Scripts/release/regression_inventory.py --run-lane windows-parity-regression-tooling

  analyzer-freshness:
    runs-on: windows-latest
    steps:
      - name: Enable Git long-path support
        shell: pwsh
        run: |
          $globalConfig = Join-Path $env:RUNNER_TEMP ("git-global-{0}.config" -f $env:GITHUB_RUN_ID)
          "GIT_CONFIG_GLOBAL=$globalConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:GIT_CONFIG_GLOBAL = $globalConfig
          git config --global core.longpaths true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Phase181 Win64 custom ROS2 typesupport identities
        run: |
          python Scripts/ros2forunity/interfaces/validate_foxrun_custom_typesupport_addon.py --distro humble --require-rmw rmw_fastrtps_cpp
          python Scripts/ros2forunity/interfaces/validate_foxrun_custom_typesupport_addon.py --distro jazzy --require-rmw rmw_fastrtps_cpp
          python Scripts/ros2forunity/interfaces/validate_foxrun_custom_typesupport_addon.py --distro lyrical --require-rmw rmw_fastrtps_cpp
          python Scripts/ros2forunity/interfaces/validate_foxrun_custom_typesupport_addon.py --distro lyrical --require-rmw rmw_zenoh_cpp

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0"

      - name: Restore Windows Editor restart relay tests
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj -p:IncludeRos2ForUnityAdapter=true

      - name: Run Windows Editor restart relay process tests
        run: dotnet test --no-restore Packages/dev.unity2foxglove.sdk/Tests/Unit/FoxgloveSdk.UnitTests.csproj -p:IncludeRos2ForUnityAdapter=true --filter "FullyQualifiedName~Ros2ForUnityEditorRestartRelayTests"

      - name: Restore Roslyn analyzer project
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Editor/SourceGenerators/FoxgloveLogSourceGenerator.csproj

      - name: Validate source generator DLL freshness script
        run: python Scripts/package/validate_source_generator_dll.py

      - name: Restore runtime test project
        run: dotnet restore Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj

      - name: Verify checked-in analyzer DLL freshness
        run: dotnet run --no-restore --project Packages/dev.unity2foxglove.sdk/Tests/Runtime/FoxgloveSdk.Tests.csproj -- --phase115f

  test:
    name: test
    if: always()
    needs:
      - linux-xunit
      - linux-runtime
      - linux-python-regressions
      - linux-identity-gate
      - linux-conformance-panels
      - optional-ros2-adapter
      - optional-ros2-native
      - optional-ros2-runtime-validation
      - u2r2-native
      - windows-parity
      - analyzer-freshness
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation lane to succeed
        env:
          LINUX_XUNIT_RESULT: ${{ needs['linux-xunit'].result }}
          LINUX_RUNTIME_RESULT: ${{ needs['linux-runtime'].result }}
          LINUX_PYTHON_RESULT: ${{ needs['linux-python-regressions'].result }}
          LINUX_IDENTITY_RESULT: ${{ needs['linux-identity-gate'].result }}
          LINUX_CONFORMANCE_RESULT: ${{ needs['linux-conformance-panels'].result }}
          ADAPTER_RESULT: ${{ needs['optional-ros2-adapter'].result }}
          NATIVE_RESULT: ${{ needs['optional-ros2-native'].result }}
          RUNTIME_VALIDATION_RESULT: ${{ needs['optional-ros2-runtime-validation'].result }}
          U2R2_RESULT: ${{ needs['u2r2-native'].result }}
          WINDOWS_RESULT: ${{ needs['windows-parity'].result }}
          ANALYZER_RESULT: ${{ needs['analyzer-freshness'].result }}
        run: |
          set -eu
          failed=0
          for result in \
            "linux-xunit=$LINUX_XUNIT_RESULT" \
            "linux-runtime=$LINUX_RUNTIME_RESULT" \
            "linux-python-regressions=$LINUX_PYTHON_RESULT" \
            "linux-identity-gate=$LINUX_IDENTITY_RESULT" \
            "linux-conformance-panels=$LINUX_CONFORMANCE_RESULT" \
            "optional-ros2-adapter=$ADAPTER_RESULT" \
            "optional-ros2-native=$NATIVE_RESULT" \
            "optional-ros2-runtime-validation=$RUNTIME_VALIDATION_RESULT" \
            "u2r2-native=$U2R2_RESULT" \
            "windows-parity=$WINDOWS_RESULT" \
            "analyzer-freshness=$ANALYZER_RESULT"; do
            name="${result%%=*}"
            value="${result#*=}"
            echo "$name: $value"
            if [ "$value" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Validation aggregate failed." >&2
            exit 1
          fi
          echo "Validation aggregate passed."
