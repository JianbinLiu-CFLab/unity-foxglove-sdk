name: performance evidence

on:
  pull_request:
    paths:
      - 'Packages/dev.unity2foxglove.sdk/Runtime/Transport/**'
      - 'Packages/dev.unity2foxglove.sdk/Runtime/Components/FoxRun/**'
      - 'Packages/dev.unity2foxglove.sdk/Runtime/Components/Manager/**'
      - 'Packages/dev.unity2foxglove.sdk/Runtime/Core/**'
      - 'Packages/dev.unity2foxglove.sdk/Runtime/Schemas/**'
      - 'Packages/dev.unity2foxglove.sdk/Runtime/IO/**'
      - 'Packages/dev.unity2foxglove.sdk/Tests/Performance/**'
      - 'Scripts/performance/**'
      - '.github/workflows/performance.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Run performance baseline
        run: python3 Scripts/performance/run_baseline.py --quick --thresholds Packages/dev.unity2foxglove.sdk/Tests/Performance/performance-thresholds.ci.json --output build/performance-ci
      - name: Upload performance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-ci-report
          path: build/performance-ci/*.json
      - name: Write performance summary
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = sorted(Path('build/performance-ci').glob('*.json'))[-1]
          data = json.loads(report.read_text(encoding='utf-8'))
          print('| Scenario | Messages/s | MB/s | Allocated bytes/message | Drop ratio | Queued high-water |')
          print('| --- | ---: | ---: | ---: | ---: | ---: |')
          for row in data.get('scenarios', []):
              components = row.get('components') or [row]
              for component in components:
                  print(
                      f"| {component.get('name', row.get('name', '?'))} | "
                      f"{component.get('messagesPerSecond', 0):.0f} | "
                      f"{component.get('bytesPerSecond', 0) / 1_000_000:.3f} | "
                      f"{component.get('allocatedBytesPerMessage', 0):.1f} | "
                      f"{component.get('dropRatio', row.get('dropRatio', 0)):.3f} | "
                      f"{component.get('queuedBytesHighWater', row.get('queuedBytesHighWater', 0))} |"
                  )
          PY
