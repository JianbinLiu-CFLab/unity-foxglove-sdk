name: Unity batch compile and path-aware gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: unity-compile-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  unity_scope:
    name: unity-scope
    runs-on: ubuntu-latest
    outputs:
      unity_required: ${{ steps.scope.outputs.unity_required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether Unity evidence is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed="$(git diff-tree --no-commit-id --no-renames --name-only -r "$HEAD_SHA")"
            required=true
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA")"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --no-renames --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          else
            changed="$(git diff-tree --no-commit-id --no-renames --name-only -r "$HEAD_SHA")"
          fi

          if [ "$EVENT_NAME" != "workflow_dispatch" ] && printf '%s\n' "$changed" | grep -Eq '^(Packages/[^/]+/(Runtime|Editor)/|Packages/[^/]+/package\.json$|Unity2Foxglove/(Assets|Packages|ProjectSettings)/|.*\.(asmdef|asmref|meta)$)'; then
            required=true
          fi

          printf 'Changed paths:\n%s\n' "$changed"
          printf 'unity_required=%s\n' "$required" >> "$GITHUB_OUTPUT"

  unity_compile:
    name: unity-compile
    needs: unity_scope
    if: >-
      needs.unity_scope.outputs.unity_required == 'true'
      && vars.UNITY_SELF_HOSTED_RUNNER == 'enabled'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, unity2foxglove-phase186-live]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Clean runner workspace while preserving Unity Library
        shell: pwsh
        run: git clean -ffdx -e Unity2Foxglove/Library/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Unity gate process ownership dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input psutil==7.0.0

      - name: Run exact Unity batch import and compile gate
        shell: pwsh
        run: python -B Scripts/release/run_unity_batch_compile.py --project-path Unity2Foxglove --timeout-seconds 3600

      - name: Upload Unity batch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-batch-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/unity-batch-compile
          if-no-files-found: warn

  unity_required:
    name: unity-required
    needs:
      - unity_scope
      - unity_compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce path-aware Unity evidence policy
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.unity_scope.result }}
          UNITY_REQUIRED: ${{ needs.unity_scope.outputs.unity_required }}
          UNITY_RESULT: ${{ needs.unity_compile.result }}
          RUNNER_ENABLED: ${{ vars.UNITY_SELF_HOSTED_RUNNER }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::Unity scope detection failed; refusing to bypass the required gate."
            exit 1
          fi
          if [ "$UNITY_REQUIRED" != "true" ]; then
            echo "UNITY_GATE_NOT_REQUIRED"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "::error::Unity changes from fork PRs require a trusted maintainer branch; self-hosted execution is blocked."
            exit 1
          fi
          if [ "$RUNNER_ENABLED" != "enabled" ]; then
            echo "::error::UNITY_SELF_HOSTED_RUNNER is not enabled; Unity changes cannot merge without the gate."
            exit 1
          fi
          if [ "$UNITY_RESULT" != "success" ]; then
            echo "::error::unity-compile result: $UNITY_RESULT"
            exit 1
          fi
          echo "UNITY_GATE_PASS"
