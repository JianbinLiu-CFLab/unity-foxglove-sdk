name: Unity batch compile (non-required)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: unity-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unity-compile:
    # This self-hosted lane is intentionally non-required until its licensed
    # Unity environment has demonstrated stable availability.
    name: unity-compile
    runs-on: [self-hosted, Windows, X64, unity2foxglove-phase186-live]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Unity gate process ownership dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input psutil==7.0.0

      - name: Run exact Unity batch import and compile gate
        shell: pwsh
        run: python -B Scripts/release/run_unity_batch_compile.py --project-path Unity2Foxglove

      - name: Upload Unity batch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-batch-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/unity-batch-compile
          if-no-files-found: warn
