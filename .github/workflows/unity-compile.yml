name: Unity batch compile and path-aware gate

on:
  workflow_dispatch:
    inputs:
      distro:
        description: Runtime distro to compile in the Unity workspace
        required: false
        default: both
        type: choice
        options:
          - humble
          - lyrical
          - both
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: unity-compile-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  unity_scope:
    name: unity-scope
    runs-on: ubuntu-latest
    outputs:
      unity_required: ${{ steps.scope.outputs.unity_required }}
      distro_compile: ${{ steps.scope.outputs.distro_compile }}
    steps:
      - name: Checkout comparison tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether Unity evidence is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISTRO_INPUT: ${{ github.event.inputs.distro }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          required=false
          distro_compile=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed="$(git diff-tree --no-commit-id --no-renames --name-only -r "$HEAD_SHA")"
            required=true
            if [ "${DISTRO_INPUT:-both}" = "humble" ] || [ "${DISTRO_INPUT:-both}" = "lyrical" ] || [ "${DISTRO_INPUT:-both}" = "both" ]; then
              distro_compile=true
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA")"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --no-renames --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          else
            changed="$(git diff-tree --no-commit-id --no-renames --name-only -r "$HEAD_SHA")"
          fi

          if [ "$EVENT_NAME" != "workflow_dispatch" ] && printf '%s\n' "$changed" | grep -E '^(Packages/[^/]+/(Runtime|Editor|Plugins|Tests/(Runtime|Unit))/|Packages/[^/]+/package\.json$|Unity2Foxglove/(Assets|Packages|ProjectSettings)/|.*\.(asmdef|asmref|meta)$)' >/dev/null; then
            required=true
          fi

          if printf '%s\n' "$changed" | grep -E '^Packages/dev\.unity2foxglove\.ros2forunity\.runtime\.(humble|lyrical)\.win64/' >/dev/null; then
            distro_compile=true
          fi

          printf 'Changed paths:\n%s\n' "$changed"
          printf 'unity_required=%s\n' "$required" >> "$GITHUB_OUTPUT"
          printf 'distro_compile=%s\n' "$distro_compile" >> "$GITHUB_OUTPUT"

  unity_compile:
    name: unity-compile
    needs: unity_scope
    if: >-
      needs.unity_scope.outputs.unity_required == 'true'
      && vars.UNITY_SELF_HOSTED_RUNNER == 'enabled'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, unity2foxglove-phase186-live]
    steps:
      - name: Bootstrap PowerShell 7 on PATH
        shell: cmd
        run: |
          set "POWERSHELL7=C:\Program Files\PowerShell\7"
          if not exist "%POWERSHELL7%\pwsh.exe" (
            echo PowerShell 7 MSI installation is required.
            exit /b 1
          )
          echo %POWERSHELL7%>>"%GITHUB_PATH%"
          set "PATH=%POWERSHELL7%;%PATH%"
          where pwsh
          pwsh -NoLogo -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: Enable Git long-path support
        shell: pwsh
        run: |
          $globalConfig = Join-Path $env:RUNNER_TEMP ("git-global-{0}.config" -f $env:GITHUB_RUN_ID)
          "GIT_CONFIG_GLOBAL=$globalConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:GIT_CONFIG_GLOBAL = $globalConfig
          git config --global core.longpaths true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false


      - name: Clean runner workspace while preserving Unity Library
        shell: pwsh
        run: git clean -ffdx -e 'Unity2Foxglove/Library*/'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Unity gate process ownership dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input psutil==7.0.0

      - name: Run exact Unity batch import and compile gate
        shell: pwsh
        run: python -B Scripts/release/run_unity_batch_compile.py --project-path Unity2Foxglove --timeout-seconds 3600

      - name: Upload Unity batch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-batch-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/unity-batch-compile
          if-no-files-found: warn

  unity-tests:
    name: unity-tests
    needs: unity_compile
    if: >-
      needs.unity_compile.result == 'success'
      && vars.UNITY_SELF_HOSTED_RUNNER == 'enabled'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, unity2foxglove-phase186-live]
    steps:
      - name: Bootstrap PowerShell 7 on PATH
        shell: cmd
        run: |
          set "POWERSHELL7=C:\Program Files\PowerShell\7"
          if not exist "%POWERSHELL7%\pwsh.exe" (
            echo PowerShell 7 MSI installation is required.
            exit /b 1
          )
          echo %POWERSHELL7%>>"%GITHUB_PATH%"
          set "PATH=%POWERSHELL7%;%PATH%"
          where pwsh
          pwsh -NoLogo -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: Enable Git long-path support
        shell: pwsh
        run: |
          $globalConfig = Join-Path $env:RUNNER_TEMP ("git-global-{0}.config" -f $env:GITHUB_RUN_ID)
          "GIT_CONFIG_GLOBAL=$globalConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:GIT_CONFIG_GLOBAL = $globalConfig
          git config --global core.longpaths true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Clean runner workspace while preserving Unity Library
        shell: pwsh
        run: git clean -ffdx -e 'Unity2Foxglove/Library*/'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Unity test process ownership dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input psutil==7.0.0

      - name: Run Unity EditMode tests
        if: always()
        shell: pwsh
        run: >-
          python -B Scripts/release/run_unity_tests.py
          --project-path Unity2Foxglove
          --test-platform EditMode
          --test-results build/unity-tests/editmode/results.xml
          --log-file build/unity-tests/editmode/unity.log
          --timeout-seconds 3600
          --test-category "!GraphicsAcceptance"
          --nographics

      - name: Run Unity PlayMode tests
        if: always()
        shell: pwsh
        run: >-
          python -B Scripts/release/run_unity_tests.py
          --project-path Unity2Foxglove
          --test-platform PlayMode
          --test-results build/unity-tests/playmode/results.xml
          --log-file build/unity-tests/playmode/unity.log
          --timeout-seconds 3600
          --test-category "!GraphicsAcceptance"
          --nographics

      - name: Run Unity graphics acceptance tests
        if: always()
        shell: pwsh
        run: >-
          python -B Scripts/release/run_unity_tests.py
          --project-path Unity2Foxglove
          --test-platform PlayMode
          --test-category GraphicsAcceptance
          --test-results build/unity-tests/graphics/playmode/results.xml
          --log-file build/unity-tests/graphics/playmode/unity.log
          --timeout-seconds 3600

      - name: Upload Unity graphics acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-graphics-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/unity-tests/graphics
          if-no-files-found: warn

      - name: Upload Unity Test Runner diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/unity-tests
          if-no-files-found: warn

  unity_distro_compile:
    name: unity-distro-compile (${{ matrix.distro }})
    needs: unity_scope
    strategy:
      max-parallel: 1
      matrix:
        distro: [humble, lyrical]
    if: >-
      needs.unity_scope.outputs.distro_compile == 'true'
      && vars.UNITY_SELF_HOSTED_RUNNER == 'enabled'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'workflow_dispatch'
          || github.event.inputs.distro == 'both'
          || github.event.inputs.distro == matrix.distro)
    runs-on: [self-hosted, Windows, X64, unity2foxglove-phase186-live]
    env:
      DISTRO: ${{ matrix.distro }}
    steps:
      - name: Bootstrap PowerShell 7 on PATH
        shell: cmd
        run: |
          set "POWERSHELL7=C:\Program Files\PowerShell\7"
          if not exist "%POWERSHELL7%\pwsh.exe" (
            echo PowerShell 7 MSI installation is required.
            exit /b 1
          )
          echo %POWERSHELL7%>>"%GITHUB_PATH%"
          set "PATH=%POWERSHELL7%;%PATH%"
          where pwsh
          pwsh -NoLogo -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: Enable Git long-path support
        shell: pwsh
        run: |
          $globalConfig = Join-Path $env:RUNNER_TEMP ("git-global-{0}.config" -f $env:GITHUB_RUN_ID)
          "GIT_CONFIG_GLOBAL=$globalConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:GIT_CONFIG_GLOBAL = $globalConfig
          git config --global core.longpaths true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Recover interrupted distro workspace swap
        shell: pwsh
        run: |
          $markers = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'build') -Filter 'phase195-distro-swap-*.json' -File -ErrorAction SilentlyContinue)
          foreach ($markerFile in $markers) {
            $state = Get-Content -LiteralPath $markerFile.FullName -Raw | ConvertFrom-Json
            $project = Join-Path $env:GITHUB_WORKSPACE 'Unity2Foxglove'
            $library = Join-Path $project 'Library'
            $jazzy = Join-Path $project 'Library-jazzy'
            $target = Join-Path $project ("Library-{0}" -f $state.distro)
            if (-not (Test-Path -LiteralPath $library)) {
              if (Test-Path -LiteralPath $jazzy) { Move-Item -LiteralPath $jazzy -Destination $library }
              elseif (Test-Path -LiteralPath $target) { Move-Item -LiteralPath $target -Destination $library }
            }
            if (Test-Path -LiteralPath $state.manifest_backup) { Copy-Item -LiteralPath $state.manifest_backup -Destination $state.manifest -Force }
            if (Test-Path -LiteralPath $state.lock_backup) { Copy-Item -LiteralPath $state.lock_backup -Destination $state.lock -Force }
            Remove-Item -LiteralPath $markerFile.FullName -Force
          }

      - name: Clean runner workspace while preserving all Unity Library caches
        shell: pwsh
        run: git clean -ffdx -e 'Unity2Foxglove/Library*/'

      - name: Prepare distro manifest and isolated Library
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'Unity2Foxglove'
          $manifest = Join-Path $project 'Packages/manifest.json'
          $lock = Join-Path $project 'Packages/packages-lock.json'
          $manifestBackup = Join-Path $env:GITHUB_WORKSPACE ("build/phase195-manifest-{0}.json" -f $env:DISTRO)
          $lockBackup = Join-Path $env:GITHUB_WORKSPACE ("build/phase195-lock-{0}.json" -f $env:DISTRO)
          New-Item -ItemType Directory -Force -Path (Split-Path $manifestBackup) | Out-Null
          Copy-Item -LiteralPath $manifest -Destination $manifestBackup -Force
          if (Test-Path -LiteralPath $lock) { Copy-Item -LiteralPath $lock -Destination $lockBackup -Force } else { Remove-Item -LiteralPath $lockBackup -Force -ErrorAction SilentlyContinue }
          $marker = Join-Path $env:GITHUB_WORKSPACE ("build/phase195-distro-swap-{0}.json" -f $env:DISTRO)
          @{ distro = $env:DISTRO; manifest = $manifest; lock = $lock; manifest_backup = $manifestBackup; lock_backup = $lockBackup } | ConvertTo-Json | Set-Content -LiteralPath $marker -Encoding utf8

          $library = Join-Path $project 'Library'
          $jazzy = Join-Path $project 'Library-jazzy'
          $target = Join-Path $project ("Library-{0}" -f $env:DISTRO)
          if (Test-Path -LiteralPath $library) {
            if (Test-Path -LiteralPath $jazzy) {
              $prior = Join-Path $project ("Library-jazzy-prior-{0}" -f $env:GITHUB_RUN_ID)
              Move-Item -LiteralPath $jazzy -Destination $prior
            }
            Move-Item -LiteralPath $library -Destination $jazzy
          }
          if (Test-Path -LiteralPath $target) {
            Move-Item -LiteralPath $target -Destination $library
          }

          $manifestObject = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          foreach ($name in @(
            'dev.unity2foxglove.ros2forunity.runtime.humble.win64',
            'dev.unity2foxglove.ros2forunity.runtime.jazzy.win64',
            'dev.unity2foxglove.ros2forunity.runtime.lyrical.win64'
          )) { $manifestObject.dependencies.PSObject.Properties.Remove($name) }
          $packageName = "dev.unity2foxglove.ros2forunity.runtime.{0}.win64" -f $env:DISTRO
          $manifestObject.dependencies | Add-Member -NotePropertyName $packageName -NotePropertyValue ("file:../../Packages/{0}" -f $packageName)
          $manifestObject | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $manifest -Encoding utf8
          Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Unity gate process ownership dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input psutil==7.0.0

      - name: Run distro Unity batch import and compile gate
        shell: pwsh
        run: python -B Scripts/release/run_unity_batch_compile.py --project-path Unity2Foxglove --timeout-seconds 3600

      - name: Restore distro manifest and Library
        if: always()
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'Unity2Foxglove'
          $marker = Join-Path $env:GITHUB_WORKSPACE ("build/phase195-distro-swap-{0}.json" -f $env:DISTRO)
          if (Test-Path -LiteralPath $marker) {
            $state = Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json
            if (Test-Path -LiteralPath $state.manifest_backup) { Copy-Item -LiteralPath $state.manifest_backup -Destination $state.manifest -Force }
            if (Test-Path -LiteralPath $state.lock_backup) { Copy-Item -LiteralPath $state.lock_backup -Destination $state.lock -Force } else { Remove-Item -LiteralPath $state.lock -Force -ErrorAction SilentlyContinue }
            $library = Join-Path $project 'Library'
            $jazzy = Join-Path $project 'Library-jazzy'
            $target = Join-Path $project ("Library-{0}" -f $env:DISTRO)
            if (Test-Path -LiteralPath $library) {
              if (Test-Path -LiteralPath $target) {
                $prior = Join-Path $project ("Library-{0}-prior-{1}" -f $env:DISTRO, $env:GITHUB_RUN_ID)
                Move-Item -LiteralPath $target -Destination $prior
              }
              Move-Item -LiteralPath $library -Destination $target
            }
            if (Test-Path -LiteralPath $jazzy) { Move-Item -LiteralPath $jazzy -Destination $library }
            Remove-Item -LiteralPath $marker -Force
          }
          $status = git status --porcelain
          if ($status) { Write-Error ("Distro workspace is dirty after restoration:`n{0}" -f ($status -join "`n")); exit 1 }

      - name: Upload distro Unity diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-distro-${{ matrix.distro }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/unity-batch-compile
          if-no-files-found: warn

  unity_required:
    name: unity-required
    needs:
      - unity_scope
      - unity_compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce path-aware Unity evidence policy
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.unity_scope.result }}
          UNITY_REQUIRED: ${{ needs.unity_scope.outputs.unity_required }}
          UNITY_RESULT: ${{ needs.unity_compile.result }}
          RUNNER_ENABLED: ${{ vars.UNITY_SELF_HOSTED_RUNNER }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::Unity scope detection failed; refusing to bypass the required gate."
            exit 1
          fi
          if [ "$UNITY_REQUIRED" != "true" ]; then
            echo "UNITY_GATE_NOT_REQUIRED"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
              echo "::error::Unity changes from fork PRs require a trusted maintainer branch; self-hosted execution is blocked."
              exit 1
            fi
          fi
          if [ "$RUNNER_ENABLED" != "enabled" ]; then
            echo "::error::UNITY_SELF_HOSTED_RUNNER is not enabled; Unity changes cannot merge without the gate."
            exit 1
          fi
          if [ "$UNITY_RESULT" != "success" ]; then
            echo "::error::unity-compile result: $UNITY_RESULT"
            exit 1
          fi
          echo "UNITY_GATE_PASS"
