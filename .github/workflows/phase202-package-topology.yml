name: Phase202 package topology Unity harness

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Probe mode
        required: true
        default: all
        type: choice
        options:
          - resolution
          - matrix
          - all
      include_demo:
        description: Compile the checked-out demo after native-custom jazzy composition
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase202-package-topology
  cancel-in-progress: false

jobs:
  unity:
    name: Phase202 package resolution and compile
    runs-on: [self-hosted, Windows, X64, unity2foxglove-phase186-live]
    timeout-minutes: 720
    steps:
      - &require_node24_runner
        name: Require Node 24-capable Actions runner
        shell: powershell
        run: |
          $requiredVersion = [version]'2.327.1'
          $listenerPath = Join-Path $env:SystemDrive 'actions-runner\bin\Runner.Listener.exe'
          if (-not (Test-Path -LiteralPath $listenerPath)) {
            throw "Actions Runner $requiredVersion or newer is required at $listenerPath."
          }
          $versionOutput = & $listenerPath --version 2>&1
          $runnerExitCode = $LASTEXITCODE
          $versionText = ($versionOutput | Select-Object -First 1).ToString().Trim()
          if ($runnerExitCode -ne 0 -or $versionText -notmatch '^\d+\.\d+\.\d+$') {
            throw "Unable to read the Actions Runner version from $listenerPath."
          }
          $actualVersion = [version]$versionText
          if ($actualVersion -lt $requiredVersion) {
            throw "Actions Runner $actualVersion is too old for Node 24 actions. Upgrade to $requiredVersion or newer."
          }
          Write-Host "Actions Runner $actualVersion supports Node 24 actions."

      - name: Bootstrap PowerShell 7 on PATH
        shell: cmd
        run: |
          set "POWERSHELL7=C:\Program Files\PowerShell\7"
          if not exist "%POWERSHELL7%\pwsh.exe" (
            echo PowerShell 7 MSI installation is required.
            exit /b 1
          )
          echo %POWERSHELL7%>>"%GITHUB_PATH%"
          set "PATH=%POWERSHELL7%;%PATH%"
          where pwsh
          pwsh -NoLogo -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: Enable Git long-path support
        shell: pwsh
        run: |
          $globalConfig = Join-Path $env:RUNNER_TEMP ("git-global-{0}.config" -f $env:GITHUB_RUN_ID)
          "GIT_CONFIG_GLOBAL=$globalConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:GIT_CONFIG_GLOBAL = $globalConfig
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Clean runner workspace while preserving Unity Library
        shell: pwsh
        run: git clean -ffdx -e 'Unity2Foxglove/Library/' -e 'Unity2Foxglove/Library-*/'

      - name: Configure build temporary directories
        shell: pwsh
        run: |
          $tempRoot = Join-Path $env:GITHUB_WORKSPACE 'build/tmp'
          New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          "TEMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Unity gate process ownership dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input psutil==7.0.0

      - name: Verify Phase181 sample package labels and identities
        if: github.event_name == 'push' || github.event.inputs.mode == 'matrix' || github.event.inputs.mode == 'all'
        shell: pwsh
        run: |
          $generatedPackage = 'Packages/dev.unity2foxglove.foxrun.ros2.interfaces'
          $generatedMetadata = Get-Content (Join-Path $generatedPackage 'package.json') -Raw
          $generatedReadme = Get-Content (Join-Path $generatedPackage 'README.md') -Raw
          if ($generatedMetadata -notmatch 'Phase181 sample' -or $generatedReadme -notmatch 'generate their own interface package') {
            Write-Error 'The checked-in Phase181 sample package labels are stale.'
            exit 1
          }
          python -B Scripts/ros2forunity/interfaces/interface_digest.py --package-root $generatedPackage
          python -B Scripts/ros2forunity/interfaces/validate_foxrun_custom_typesupport_addon.py --distro humble --require-rmw rmw_fastrtps_cpp
          python -B Scripts/ros2forunity/interfaces/validate_foxrun_custom_typesupport_addon.py --distro jazzy --require-rmw rmw_fastrtps_cpp
          python -B Scripts/ros2forunity/interfaces/validate_foxrun_custom_typesupport_addon.py --distro lyrical --require-rmw rmw_fastrtps_cpp

      - name: Run Phase202 package-manager probes
        if: github.event_name == 'push' || github.event.inputs.mode == 'resolution' || github.event.inputs.mode == 'all'
        shell: pwsh
        run: >-
          python -B -m Scripts.package.run_package_topology_unity_matrix
          --mode resolution
          --output build/phase202/unity/resolution

      - name: Run Phase202 profile matrix
        if: github.event_name == 'push' || github.event.inputs.mode == 'matrix' || github.event.inputs.mode == 'all'
        shell: pwsh
        run: >-
          python -B -m Scripts.package.run_package_topology_unity_matrix
          --mode matrix
          --output build/phase202/unity/matrix

      - name: Backup demo manifest and lock
        if: always() && (github.event_name == 'push' || github.event.inputs.include_demo == 'true')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/phase202/unity/demo | Out-Null
          Copy-Item Unity2Foxglove/Packages/manifest.json build/phase202/unity/demo/manifest.json -Force
          if (Test-Path Unity2Foxglove/Packages/packages-lock.json) {
            Copy-Item Unity2Foxglove/Packages/packages-lock.json build/phase202/unity/demo/packages-lock.json -Force
          }

      - name: Compose and compile demo native-custom jazzy
        if: always() && (github.event_name == 'push' || github.event.inputs.include_demo == 'true')
        shell: pwsh
        run: |
          python -B -m Scripts.package.compose_unity_manifest --project Unity2Foxglove --profile native-custom --distro jazzy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Scripts/release/run_unity_batch_compile.py --project-path Unity2Foxglove --log-file build/phase202/unity/demo/unity.log --timeout-seconds 3600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore demo manifest and lock
        if: always() && (github.event_name == 'push' || github.event.inputs.include_demo == 'true')
        shell: pwsh
        run: |
          Copy-Item build/phase202/unity/demo/manifest.json Unity2Foxglove/Packages/manifest.json -Force
          if (Test-Path build/phase202/unity/demo/packages-lock.json) {
            Copy-Item build/phase202/unity/demo/packages-lock.json Unity2Foxglove/Packages/packages-lock.json -Force
          }

      - name: Collect generated package outputs
        if: always()
        shell: pwsh
        run: |
          $destination = 'build/phase202/unity/generated-packages'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $packages = @(
            'Packages/dev.unity2foxglove.foxrun.ros2.interfaces',
            'Packages/dev.unity2foxglove.foxrun.ros2.interfaces.typesupport.humble.win64',
            'Packages/dev.unity2foxglove.foxrun.ros2.interfaces.typesupport.jazzy.win64',
            'Packages/dev.unity2foxglove.foxrun.ros2.interfaces.typesupport.lyrical.win64'
          )
          foreach ($package in $packages) {
            $target = Join-Path $destination $package
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -LiteralPath $package -Destination $target -Recurse -Force
          }

      - name: Upload Phase202 Unity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase202-package-topology-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase202/unity/generated-packages
            build/phase202/unity/resolution
            build/phase202/unity/matrix/summary.json
            build/phase202/unity/matrix/logs
            build/phase202/unity/demo
          if-no-files-found: warn
